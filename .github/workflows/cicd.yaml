name: stac-fastapi
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LATEST_PY_VERSION: '3.14'

jobs:
  test:
    # ubuntu-latest is mid-migration to 26.04; pin for deterministic runs
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    timeout-minutes: 25

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.*" 
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync

      - name: Lint code
        if: ${{ matrix.python-version == env.LATEST_PY_VERSION }}
        run: |
          uv run pre-commit run --all-files
          uv run --with mypy --with types-attrs mypy -p stac_fastapi

      # Install PostgreSQL and PostGIS together from PGDG so their versions
      # always match (required since the CVE-2026-6460 extension rebuilds).
      # pytest-postgresql finds `pg_ctl` through `pg_config` on PATH.
      - name: Install PostgreSQL and PostGIS
        env:
          PG_MAJOR: "16"
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y "postgresql-${PG_MAJOR}" "postgresql-${PG_MAJOR}-postgis-3"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Run test suite
        run: uv run pytest --cov stac_fastapi.pgstac --cov-report xml --cov-report term-missing

  validate:
    runs-on: ubuntu-latest
    services:
      pgstac:
        image: ghcr.io/stac-utils/pgstac:v0.10.0
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgis
          PGUSER: username
          PGPASSWORD: password
          PGDATABASE: postgis
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --log-driver none
        ports:
          - 5432:5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.*" 
          enable-cache: true
          python-version: ${{ env.LATEST_PY_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --extra server
          uv pip install stac-api-validator==0.6.5

      - name: Load data and validate
        run: uv run python -m stac_fastapi.pgstac.app & ./scripts/wait-for-it.sh localhost:8000 && uv run ./scripts/ingest_joplin.py http://localhost:8000 && uv run ./scripts/validate http://localhost:8000
        env:
          PGUSER: username
          PGPASSWORD: password
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: postgis
          ENABLE_TRANSACTIONS_EXTENSIONS: TRUE
          STAC_FASTAPI_TITLE: STAC FastAPI PgSTAC
          STAC_FASTAPI_DESCRIPTION: STAC FastAPI with PGStac Backend
          STAC_FASTAPI_VERSION: 0.0.0
          STAC_FASTAPI_LANDING_ID: stac-fastapi-pgstac-landing
          
  test-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.*" 
          enable-cache: true
          python-version: ${{ env.LATEST_PY_VERSION }}

      - name: Test docs
        run: |
          uv run --group docs mkdocs build -f docs/mkdocs.yml 
